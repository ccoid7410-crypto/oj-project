name: durunuri-oj

# 기본 로그 드라이버(json-file)는 로테이션이 없어서 서버를 오래 켜둘수록 로그 파일이
# 끝없이 커진다 - 디스크를 다 채우거나(라즈베리파이의 SD카드는 특히 느려짐), 로그 파일 자체가
# 커지면서 쓰기/조회가 느려져 "오래 켜두면 반응성이 떨어지는" 흔한 원인이 된다.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    # 반드시 glibc 계열(bookworm)이어야 한다 - alpine(musl)로 바꿨다가 기존 pg_data 볼륨을
    # 그대로 재사용하면, 텍스트 컬럼 인덱스가 glibc collation 기준으로 만들어져 있는데
    # musl은 그 로케일의 실제 정렬 순서가 달라서(사실상 C 순서에 가까움) 인덱스가 조용히
    # 어긋난다 - 에러 없이 조회 누락/중복 unique 통과 같은 미묘한 데이터 정합성 문제로만 나타남.
    # 이미지를 다시 바꿔야 한다면 반드시 REINDEX(또는 새 클러스터로 dump/restore)까지 같이 해야 한다.
    image: postgres:16-bookworm
    networks:
      - backend_net
    # 재부팅해도 docker 데몬이 뜨면 알아서 다시 켜지도록. (컨테이너가 죽었다가 살아나는 거지,
    # docker compose up을 매번 손으로 실행해야 하는 게 아니다.)
    restart: unless-stopped
    # 8GB급 저사양 호스트(라즈베리파이 4B 등) 기준 튜닝. shared_buffers/work_mem을 낮춰서
    # postgres가 컨테이너 메모리 상한(mem_limit) 안에서 안전하게 돌도록 한다.
    command: >
      postgres
      -c shared_buffers=128MB
      -c work_mem=4MB
      -c max_connections=50
      -c effective_cache_size=384MB
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oj_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./setup.sh to generate a database password}
      POSTGRES_DB: ${POSTGRES_DB:-oj_db}
    ports:
      # 호스트 로컬(127.0.0.1)에만 바인딩 - 디버깅용으로 파이 안에서는 접근되지만
      # 외부 네트워크/인터넷에서는 직접 접근 불가. 앱은 도커 내부망(postgres:5432)으로 붙는다.
      # 외부 개방 시 이 포트가 0.0.0.0으로 열려 있으면 DB가 인터넷에 그대로 노출된다.
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oj_user} -d ${POSTGRES_DB:-oj_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "1.0"
    logging: *default-logging

  redis:
    image: redis:7-alpine
    networks:
      - backend_net
    restart: unless-stopped
    # 채점 큐/pub-sub 용도로만 쓰여 데이터량이 적으니 메모리 상한을 낮게 잡는다.
    # maxmemory-policy는 반드시 noeviction이어야 한다: BullMQ는 큐 데이터가 Redis에서
    # evict되면(allkeys-lru 등) 채점 대기 중인 제출이 그냥 사라져버린다 - 메모리 부족 시엔
    # evict 대신 에러를 내는 게 훨씬 안전하다(그러면 최소한 재시도/알아챌 수 있음).
    command: redis-server --maxmemory 96mb --maxmemory-policy noeviction
    ports:
      # redis는 비밀번호가 없으므로 절대 외부에 열면 안 된다. 호스트 로컬에만 바인딩.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
    logging: *default-logging

  api:
    build: ./oj-backend
    restart: unless-stopped
    command: ["node", "dist/main.js"]
    env_file: ./oj-backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-oj_user}:${POSTGRES_PASSWORD:?run ./setup.sh first}@postgres:5432/${POSTGRES_DB:-oj_db}?schema=public
      REDIS_HOST: redis
      # 인터체인저 전용 내부 리스너. 호스트로 publish하지 않으므로 compose 내부망에서만 닿는다.
      INTERNAL_PORT: 3001
      # 인터체인저가 내부 리스너에서 채점 재료/상태를 주고받을 때 검증하는 서비스 토큰.
      # 루트 .env에 생성되는 값을 명시적으로 전달해야 기존 oj-backend/.env를 쓰는 서버에서도
      # 내부 리스너가 활성화된다.
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?run ./setup.sh to generate service tokens}
      # 컨테이너 메모리 상한(384M)보다 여유 있게 힙을 잡아두면 OOM-kill 직전에 GC가 못 돌아
      # 급사하는 대신, V8이 스스로 컬렉션을 더 자주 돌려서 은근슬쩍 버틴다.
      NODE_OPTIONS: --max-old-space-size=320
    ports:
      # API도 호스트 로컬에만. 공개 진입점은 프론트 nginx(8080)뿐이고, nginx가 /api를
      # 내부망으로 프록시한다. 3000을 외부에 열면 보안 헤더/프록시를 우회해 API에 직접
      # 접근할 수 있으니 막는다.
      - "127.0.0.1:${API_PORT:-3000}:3000"
    volumes:
      # 배너 이미지 등 업로드 파일. 볼륨에 담아둬야 build --no-cache/컨테이너 재생성 후에도
      # 관리자가 올린 파일이 사라지지 않는다.
      - banner_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
    # 컨테이너에는 스키마만 들어있고 실제 마이그레이션 적용은 기동 시 한 번 실행한다.
    # (여러 인스턴스를 띄워도 prisma migrate deploy는 안전하게 반복 실행 가능)
    entrypoint: ["sh", "-c", "npx prisma migrate deploy && node dist/main.js"]
    networks:
      - backend_net
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "1.0"
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # 백엔드↔채점기 사이의 유일한 중개자.
  # 공개 프록시(:4000)도 구현돼 있지만 프론트 nginx는 아직 api:3000으로 직접 연결한다.
  # WebSocket 이중 프록시 검증이 끝난 뒤에만 /api·/socket.io·/uploads를 :4000으로 전환한다.
  # 공개(4000)와 내부(4001) 리스너를 분리해서, 경로 규칙 실수로 내부 엔드포인트가
  # 브라우저에 노출되는 사고가 구조적으로 불가능하게 만든다.
  interchanger:
    build: ./interchanger
    networks:
      - backend_net
      - judge_net
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      API_PUBLIC_URL: http://api:3000
      API_INTERNAL_URL: http://api:3001
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?run ./setup.sh to generate service tokens}
      JUDGE_SERVICE_TOKEN: ${JUDGE_SERVICE_TOKEN:?run ./setup.sh to generate service tokens}
      PUBLIC_PORT: 4000
      INTERNAL_PORT: 4001
    ports:
      # 현재는 같은 Compose 호스트의 judge-worker가 내부 judge_net으로 붙으므로 publish된
      # 4001을 사용하지 않는다. 향후 별도 VM2로 옮길 때만 JUDGE_BIND_IP를 VM 전용 내부망
      # 주소로 지정한다(기본값은 로컬 전용).
      - "${JUDGE_BIND_IP:-127.0.0.1}:4001:4001"
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: "0.5"
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # 현재는 별도 VM이 아니라 동일 호스트의 Docker 네트워크(judge_net)로만 분리돼 있다.
  # 실제 VM2 전환 시 docker-compose.judge.yml + setup-judge.sh를 별도로 만들 계획이다.
  #
  # ⚠️ 이 서비스에는 절대 env_file(oj-backend/.env)을 달지 마세요.
  # 그 파일에는 DB 비밀번호와 JWT_SECRET이 들어 있어서, 붙이는 순간 채점 VM에서
  # `docker exec cat`으로 읽을 수 있는 형태로 자격증명이 올라갑니다.
  # 채점기가 알아야 하는 값은 아래 environment에 있는 것이 전부입니다.
  judge-worker:
    build: ./oj-backend
    restart: unless-stopped
    command: ["node", "dist/main-worker.js"]
    networks:
      - judge_net
    environment:
      # DB/Redis 주소도 자격증명도 주지 않는다. 일감은 인터체인저에서만 받는다.
      INTERCHANGER_URL: http://interchanger:4001
      JUDGE_SERVICE_TOKEN: ${JUDGE_SERVICE_TOKEN:?run ./setup.sh to generate service tokens}
      JUDGE_DOCKER_SOCK: /var/run/docker.sock
      JUDGE_TMP_DIR: /judge-tmp
      HOST_JUDGE_TMP_DIR: ${HOST_JUDGE_TMP_DIR:?run ./setup.sh first to set this}
      # 관리자가 DB에서 바꿀 수 있는 이미지 이름을 채점 VM이 무조건 신뢰하지 않도록 제한한다.
      JUDGE_ALLOWED_IMAGE_PREFIXES: "gcc:,python:,eclipse-temurin:,node:,golang:,busybox:,mono:,zenika/kotlin:,swift:,ruby:,rust:,php:,nickblah/lua:,perl:,haskell:,r-base:,dart:,bash:,julia:,nimlang/nim:,crystallang/crystal:,silkeh/fpc:"
      NODE_OPTIONS: --max-old-space-size=192
      # 라즈베리파이 4B(4코어) 기준 기본값. 컴파일 단계(특히 Java/C++)가 순간적으로
      # 512MB까지 쓸 수 있어서, 2로 두면 최악의 경우 동시에 ~1GB까지 튈 수 있다.
      # 채점이 자주 밀리거나 메모리가 빠듯하면 .env에서 1로 낮출 것.
      JUDGE_CONCURRENCY: ${JUDGE_CONCURRENCY:-2}
    volumes:
      # Docker-outside-of-Docker: 워커가 형제 컨테이너(채점용)를 직접 띄우기 위함.
      # 이 소켓 마운트가 곧 현재 호스트 root 권한과 동급이다. judge_net 분리는 네트워크
      # 경로만 줄일 뿐 호스트 격리가 아니며, 운영 최종 상태는 전용 서버/VM이어야 한다.
      - /var/run/docker.sock:/var/run/docker.sock
      # 채점 코드/실행 결과를 담는 디렉토리를 호스트와 공유. 형제 컨테이너(채점용)를
      # 띄울 때 바인드 마운트 소스는 "호스트 경로"여야 하므로, 워커 컨테이너 내부 경로와
      # 호스트 경로가 이 볼륨을 통해 동일한 디렉토리를 가리키게 맞춰준다.
      # HOST_JUDGE_TMP_DIR은 이 저장소를 내려받은 절대경로 기준으로 setup.sh가 자동으로 채워준다.
      - ${HOST_JUDGE_TMP_DIR:?run ./setup.sh first to set this}:/judge-tmp
    # Docker 소켓 접근 때문에 워커만 root로 실행한다. 공개 HTTP API는 Dockerfile의 node 유저로 실행된다.
    user: "0:0"
    depends_on:
      interchanger:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1.0"
    logging: *default-logging

  frontend:
    build:
      context: ./oj-frontend
      args:
        # 비워두면(기본값) 프론트가 같은 origin의 상대 경로(/api)로 nginx를 통해 API를 부른다 -
        # 접속 주소가 IP든 도메인이든 항상 되고 CORS도 안 걸린다. 백엔드를 완전히 다른
        # 도메인에 별도로 둔 특수한 배포가 아니면 VITE_API_URL을 따로 지정할 필요가 없다.
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - backend_net
    depends_on:
      - api
      - homepage
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.5"
    logging: *default-logging

  # 동아리 홈페이지 (정적 사이트). 외부에 직접 포트를 열지 않고 frontend nginx가
  # /home/ 경로로 프록시한다. OJ와 같은 origin을 유지해야 localStorage의 로그인
  # 토큰(oj_token)이 공유되어 두 페이지 간 로그인 상태가 이어지기 때문이다.
  homepage:
    build: ./club-homepage
    networks:
      - backend_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 32M
          cpus: "0.25"
    logging: *default-logging

volumes:
  pg_data:
  banner_uploads:

# 채점기를 백엔드 망에서 떼어놓는다.
#
# 자격증명을 빼앗는 것만으로는 부족하다 - 같은 네트워크에 있으면 채점 VM이 뚫렸을 때
# 여전히 redis(비밀번호 없음)에 직접 붙어 큐를 조작하거나 가짜 채점 결과를 발행할 수 있다.
# judge_net에는 인터체인저와 채점기만 있고, 인터체인저만 양쪽에 걸쳐 다리 역할을 한다.
# 그래서 채점기가 백엔드에 닿는 경로가 물리적으로 인터체인저 하나뿐이 된다.
networks:
  backend_net:
    driver: bridge
  judge_net:
    driver: bridge
