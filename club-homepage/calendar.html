<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>일정 | 두루누리</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
</head>
<body class="gate-pending">
  <header class="site-header">
    <div class="header-top">
      <a href="index.html" class="logo">
        <div class="logo-title">Durunuri<span class="logo-accent">&gt;</span></div>
        <div class="logo-subtitle">CBSH 정보과</div>
      </a>
      <div class="header-links">
        <span id="auth-area" class="auth-area"></span>
      </div>
    </div>
    <nav class="header-nav">
      <a href="hall-of-fame.html">명예의 전당</a>
      <a href="community.html">커뮤니티</a>
      <a href="calendar.html" aria-current="page">일정</a>
      <a href="https://cbgpu.vercel.app/" target="_blank" rel="noopener noreferrer">CBGPU</a>
      <a href="/" class="nav-oj">Online Judge ↗</a>
    </nav>
  </header>

  <div id="site-banner" class="site-banner"></div>

  <main class="container">
    <section class="section calendar-section">
      <div class="calendar-page-header">
        <div>
          <h2>일정</h2>
          <p>수행평가 일정과 시험 범위를 한눈에 확인하세요.</p>
        </div>
        <div class="calendar-controls">
          <button type="button" id="calendar-prev" aria-label="이전 달">‹</button>
          <button type="button" id="calendar-today">오늘</button>
          <button type="button" id="calendar-next" aria-label="다음 달">›</button>
        </div>
      </div>

      <div class="calendar-month-row">
        <h3 id="calendar-month"></h3>
        <div class="calendar-legend" aria-label="일정 종류">
          <span><i class="legend-dot legend-assessment"></i>수행평가</span>
          <span><i class="legend-dot legend-exam"></i>시험</span>
        </div>
      </div>

      <div class="calendar-scroll">
        <div class="calendar" aria-label="월간 일정 달력">
          <div class="calendar-weekdays" aria-hidden="true">
            <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
          </div>
          <div id="calendar-grid" class="calendar-grid"></div>
        </div>
      </div>

      <div id="calendar-schedule-list" class="calendar-schedule-list" aria-live="polite">
        <p class="loading">일정을 불러오는 중...</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 두루누리. All rights reserved.</p>
  </footer>

  <script src="js/gate.js"></script>
  <script src="js/main.js"></script>
  <script src="js/banner.js"></script>
  <script src="js/calendar.js"></script>
</body>
</html>
