  <div id="site-banner" class="site-banner"></div>

  <main class="container">
    <section class="section calendar-section">
      <div class="calendar-page-header">
        <div>
          <h2>일정</h2>
          <p>수행평가, 시험, 행사와 학교 일정을 한눈에 확인하세요.</p>
        </div>
        <div class="calendar-controls">
          <button type="button" id="calendar-prev" aria-label="이전 달">‹</button>
          <button type="button" id="calendar-today">오늘</button>
          <button type="button" id="calendar-next" aria-label="다음 달">›</button>
        </div>
      </div>

      <section class="calendar-proposal-panel" aria-labelledby="calendar-proposal-title">
        <div class="calendar-panel-heading">
          <div>
            <h3 id="calendar-proposal-title">일정 제안</h3>
            <p>부원 누구나 일정을 제안할 수 있습니다. 관리자가 승인하면 달력에 공개됩니다.</p>
          </div>
          <button id="schedule-proposal-toggle" type="button" class="btn btn-ghost" aria-expanded="false" aria-controls="schedule-proposal-form">펼치기</button>
        </div>
        <form id="schedule-proposal-form" class="calendar-proposal-form" hidden>
          <label class="calendar-field">
            <span>종류</span>
            <select id="schedule-type" class="field-select" required>
              <option value="ASSESSMENT">수행평가</option>
              <option value="EXAM">시험</option>
              <option value="EVENT">행사 및 축제</option>
              <option value="OTHER">기타</option>
              <option value="VACATION">방학</option>
            </select>
          </label>
          <label id="schedule-subject-field" class="calendar-field">
            <span>과목</span>
            <input id="schedule-subject" class="field-input" type="text" maxlength="50" placeholder="예: 수학" required>
          </label>
          <label class="calendar-field calendar-field-wide">
            <span>일정 제목</span>
            <input id="schedule-title" class="field-input" type="text" maxlength="100" placeholder="예: 확률과 통계 수행평가" required>
          </label>
          <fieldset class="calendar-class-picker calendar-field-wide">
            <legend>반 태그</legend>
            <label><input type="checkbox" name="schedule-class" value="1반"> 1반</label>
            <label><input type="checkbox" name="schedule-class" value="2반"> 2반</label>
            <label><input type="checkbox" name="schedule-class" value="3반"> 3반</label>
          </fieldset>
          <label id="schedule-start-field" class="calendar-field">
            <span id="schedule-start-label">시작일</span>
            <input id="schedule-start" class="field-input" type="date" required>
          </label>
          <label id="schedule-end-field" class="calendar-field">
            <span id="schedule-end-label">종료일</span>
            <input id="schedule-end" class="field-input" type="date" required>
          </label>
          <label id="schedule-deadline-field" class="calendar-field" hidden>
            <span id="schedule-deadline-label">마감 시간</span>
            <input id="schedule-deadline-time" class="field-input" type="time" value="23:59" required>
          </label>
          <label class="calendar-field calendar-field-wide">
            <span>범위</span>
            <textarea id="schedule-scope" class="field-textarea" maxlength="1000" rows="3" placeholder="시험이나 수행평가 범위를 적어주세요."></textarea>
          </label>
          <label class="calendar-field calendar-field-wide">
            <span>추가 설명</span>
            <textarea id="schedule-description" class="field-textarea" maxlength="1000" rows="3" placeholder="준비물 등 추가 안내가 있다면 적어주세요."></textarea>
          </label>
          <div class="calendar-proposal-actions calendar-field-wide">
            <button id="schedule-submit" type="submit" class="btn btn-primary">승인 요청하기</button>
            <button id="schedule-edit-cancel" type="button" class="btn btn-ghost" hidden>수정 취소</button>
            <p id="schedule-proposal-message" aria-live="polite"></p>
          </div>
        </form>
      </section>

      <section id="schedule-approval-section" class="calendar-approval-panel" aria-labelledby="schedule-approval-title" hidden>
        <div class="calendar-panel-heading">
          <div>
            <h3 id="schedule-approval-title">승인 대기 일정</h3>
            <p>관리자가 승인한 일정만 아래 달력에 표시됩니다.</p>
          </div>
          <button id="schedule-approval-refresh" type="button" class="btn btn-ghost">새로고침</button>
        </div>
        <div id="schedule-approval-list" aria-live="polite"></div>
      </section>

      <div class="calendar-month-row">
        <h3 id="calendar-month"></h3>
        <div class="calendar-legend" aria-label="일정 종류">
          <span><i class="legend-dot legend-assessment"></i>수행평가</span>
          <span><i class="legend-dot legend-exam"></i>시험</span>
          <span><i class="legend-dot legend-event"></i>행사 및 축제</span>
          <span><i class="legend-dot legend-other"></i>기타</span>
          <span><i class="legend-dot legend-vacation"></i>방학</span>
        </div>
      </div>

      <div class="calendar-scroll">
        <div class="calendar" aria-label="월간 일정 달력">
          <div class="calendar-weekdays" aria-hidden="true">
            <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
          </div>
          <div id="calendar-grid" class="calendar-grid"></div>
        </div>
      </div>

      <div id="calendar-schedule-list" class="calendar-schedule-list" aria-live="polite">
        <p class="loading">일정을 불러오는 중...</p>
      </div>
    </section>
