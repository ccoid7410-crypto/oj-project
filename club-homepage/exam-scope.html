  <header class="site-header">
    <div class="header-top">
      <a href="index.html" class="logo">
        <div class="logo-title">Durunuri<span class="logo-accent">&gt;</span></div>
        <div class="logo-subtitle">CBSH 정보과</div>
      </a>

    </div>
    <nav class="header-nav">

      <div class="header-nav-menu">
        <a href="community.html" class="header-nav-trigger" aria-current="page">커뮤니티 <span aria-hidden="true">▾</span></a>
        <div class="header-mega-menu">
          <div class="header-mega-inner">

  <div id="site-banner" class="site-banner"></div>

  <main class="container">
    <section class="section exam-scope-section">
      <div class="exam-scope-header">
        <div>
          <h2>시험범위</h2>
          <p>수행평가와 시험 일정, 과목별 범위를 자세히 확인하세요.</p>
        </div>
        <a href="calendar.html" class="btn btn-ghost btn-sm">달력 보기</a>
      </div>

      <div class="exam-scope-toolbar" aria-label="시험범위 필터">
        <div class="exam-scope-type-filter" role="group" aria-label="일정 종류">
          <button type="button" class="active" data-scope-type="ALL">전체</button>
          <button type="button" data-scope-type="ASSESSMENT">수행평가</button>
          <button type="button" data-scope-type="EXAM">시험</button>
        </div>
        <label>
          반
          <select id="exam-scope-class" class="field-select">
            <option value="ALL">전체</option>
            <option value="1반">1반</option>
            <option value="2반">2반</option>
            <option value="3반">3반</option>
          </select>
        </label>
      </div>

      <p id="exam-scope-summary" class="exam-scope-summary" aria-live="polite"></p>
      <div id="exam-scope-list" class="exam-scope-list" aria-live="polite">
        <p class="loading">시험범위를 불러오는 중...</p>
